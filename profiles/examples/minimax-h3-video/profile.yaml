# MiniMax-H3 video profile for a Colab A100 (standard 40 GB shape: 39.5 GiB VRAM, 89.6 GB RAM, measured 2026-11-17).
# Workflows are the official Comfy-Org templates (MIT, vendored unchanged) and load exactly these files:
# pruned DiT INT8 ConvRot (20.97 GB), Qwen3-VL 32B NVFP4 text encoder (15.69 GB), video VAE INT8 (2.81 GB),
# audio VAE fp32 (0.61 GB) and the lightx2v 8-step Lightning LoRA (1.96 GB, toggle in the form, off by default).
# DiT + text encoder (~34 GiB) stay resident on the 40 GB card; the INT8 text encoder (27.14 GB) would not fit
# alongside the DiT and would be offloaded to RAM on every run, so the template's NVFP4 encoder is kept.
# yaml-language-server: $schema=../../../packages/schemas/profile.schema.json
id: minimax-h3-video
title: MiniMax-H3 Video (A100 40 GB · pruned INT8 · T2V & I2V with audio)
accelerator: A100
comfyui:
  repo: https://github.com/comfyanonymous/ComfyUI
  commit: ede4e5f
  args:
  - --preview-method
  - auto
  - --reserve-vram
  - '1.5'
  settings:
    Comfy.LinkRenderMode: 2
  env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    CUDA_MODULE_LOADING: LAZY
    TORCH_CUDNN_V8_API: '1'
    TORCH_ALLOW_TF32_CUBLAS_OVERRIDE: '1'
frontend:
  package: comfyui-frontend-package==1.59.1
models:
- id: dit-fl2va-int8
  dest: diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
  url: hf://Comfy-Org/MiniMax-H3/diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
  license: minimax-h3-community-license-agreement
  sha256: e889202c41dafb67b10d67b97f0d8541508036a6090af23425a5c2615d03c47a
  size_gb: 20.97
  core: true
- id: te-nvfp4
  dest: text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
  url: hf://Comfy-Org/MiniMax-H3/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
  license: minimax-h3-community-license-agreement
  sha256: 35a88d51044231fe332301d7a62aa81e3f2cba62febeb446e2c1e3e0ef76f2c6
  size_gb: 15.69
  core: true
- id: video-vae-int8
  dest: vae/minimax_h3_video_vae_int8_convrot.safetensors
  url: hf://Comfy-Org/MiniMax-H3/vae/minimax_h3_video_vae_int8_convrot.safetensors
  license: minimax-h3-community-license-agreement
  sha256: 52a2c8c73583c86e4f41cdcce3a6ad0ea562987bc0bf3d60a0cef5f5c8e60c0e
  size_gb: 2.81
  core: true
- id: audio-vae
  dest: vae/minimax_h3_audio_vae_fp32.safetensors
  url: hf://Comfy-Org/MiniMax-H3/vae/minimax_h3_audio_vae_fp32.safetensors
  license: minimax-h3-community-license-agreement
  sha256: 8e505d95dd1561d47abd43d4238fd40d9bb1ae9e147ed0a4cba778d76ae4db48
  size_gb: 0.61
  core: true
- id: lightning-8step
  dest: loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
  url: hf://lightx2v/Minimax-h3-Turbo/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
  license: minimax-h3-community-license-agreement
  sha256: 2339acdf19bfe123f46b971ea35d367a84adb85de43627e1eceafa5a5b2b111e
  size_gb: 1.96
  core: true
workflows:
- id: h3-t2v
  title: Video · MiniMax-H3 Text to Video (official)
  source: https://huggingface.co/Comfy-Org/MiniMax-H3
  license: MIT template; weights MiniMax H3 community license
  file: workflows/official_minimax_h3_t2v.json
  upstream_url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/video_minimax_h3_t2v.json
  upstream_sha256: 8149b64db94375cd01a7d46da0b4a4c7349d83dedf6b5e1026b460e5e202626f
  models:
  - dit-fl2va-int8
  - te-nvfp4
  - video-vae-int8
  - audio-vae
  - lightning-8step
  app:
    inputs:
    - - 140
      - prompt
      - "提示词 (Prompt)"
    - - 115
      - aspect_ratio
      - "画面比例 (Aspect Ratio)"
    - - 115
      - megapixels
      - "分辨率 / 百万像素 (Megapixels)"
    - - 140
      - value_1
      - "时长 / 秒 (Duration s)"
    - - 140
      - value
      - "Lightning 加速 (8 步 LoRA)"
    - - 140
      - noise_seed
      - "随机种子 (Seed)"
    outputs:
    - 92
- id: h3-i2v
  title: Video · MiniMax-H3 Image to Video (official)
  source: https://huggingface.co/Comfy-Org/MiniMax-H3
  license: MIT template; weights MiniMax H3 community license
  file: workflows/official_minimax_h3_i2v.json
  upstream_url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/main/templates/video_minimax_h3_i2v.json
  upstream_sha256: 8abdc39eff08babc9c731ecd05511355030d58a9ec1e90c5f266f8ee858e2eba
  models:
  - dit-fl2va-int8
  - te-nvfp4
  - video-vae-int8
  - audio-vae
  - lightning-8step
  app:
    inputs:
    - - 114
      - image
      - "首帧图片 (First Frame)"
    - - 105
      - prompt
      - "提示词 (Prompt)"
    - - 115
      - aspect_ratio
      - "画面比例 (Aspect Ratio)"
    - - 115
      - megapixels
      - "分辨率 / 百万像素 (Megapixels)"
    - - 105
      - value_1
      - "时长 / 秒 (Duration s)"
    - - 105
      - value
      - "Lightning 加速 (8 步 LoRA)"
    - - 105
      - noise_seed
      - "随机种子 (Seed)"
    outputs:
    - 92
app_default: h3-t2v
